[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python app.py"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
FLASK_APP = "app.py"
FLASK_ENV = "production"
FLASK_DEBUG = "1"
PYTHONUNBUFFERED = "1"
PORT = "5000"