[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
context = "backend"
watchPatterns = ["backend/**/*"]

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:$PORT app:app"
restartPolicyType = "on_failure"
healthcheckPath = "/api/health"
healthcheckTimeout = 100

[env]
FLASK_APP = "app.py"
FLASK_ENV = "production" 